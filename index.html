    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1A1A1A; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525B; 
      }

      /* ── Match Up splash: ball bouncing on the racket. Shared by the boot
         screen, the app's loading state and the homepage intro. ── */
      .mu-boot { position: fixed; inset: 0; z-index: 10040; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(circle at 12% 10%, rgba(229,92,48,.10), transparent 32%), radial-gradient(circle at 82% 78%, rgba(229,92,48,.08), transparent 34%), radial-gradient(ellipse 70% 50% at 50% 60%, rgba(40,70,190,.18), transparent 70%), #020D45; }
      .mu-boot--clear { background: transparent; }
      .mu-boot__logo { position: absolute; left: 50%; top: 50%; width: min(46vw, 460px); transform: translate(-50%, -50%); opacity: .1; }
      .mu-boot__logo svg, .mu-boot__racket svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .mu-boot__stage { position: relative; width: 150px; height: 400px; transform: translateY(24px); }
      .mu-boot__racket { position: absolute; left: 0; top: 62px; width: 150px; height: 338px; transform-origin: 50% 27%; }
      .mu-boot__racket svg { transform: rotate(-14deg); transform-origin: 50% 27%; filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); animation: mu-boot-kick .92s infinite; }
      .mu-boot__ball { position: absolute; left: 50%; top: 40px; width: 56px; height: 56px; margin-left: -28px; z-index: 2; }
      .mu-boot__bob { display: block; width: 100%; height: 100%; animation: mu-boot-bob .92s infinite; }
      .mu-boot__orb { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        background: radial-gradient(circle at 32% 26%, #FFB391, #E55C30 48%, #8A2D16); box-shadow: 0 0 40px rgba(229,92,48,.45), 0 0 110px rgba(229,92,48,.14); animation: mu-boot-spin 1.84s linear infinite; }
      .mu-boot__orb::before, .mu-boot__orb::after { content: ""; position: absolute; inset: -4px 16px; border: 3.5px solid rgba(2,13,69,.86); border-top-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform: rotate(25deg); }
      .mu-boot__orb::after { transform: rotate(115deg); }
      .mu-boot.is-striking .mu-boot__bob, .mu-boot.is-striking .mu-boot__racket svg { animation: none; }
      @keyframes mu-boot-bob {
        0% { transform: translateY(0) scale(1.14, .84); animation-timing-function: cubic-bezier(.2,.7,.35,1); }
        7% { transform: translateY(-14px) scale(.96, 1.06); animation-timing-function: cubic-bezier(.2,.7,.35,1); }
        50% { transform: translateY(-150px) scale(1); animation-timing-function: cubic-bezier(.65,0,.8,.35); }
        100% { transform: translateY(0) scale(1.14, .84); }
      }
      @keyframes mu-boot-kick { 0% { transform: rotate(-14deg) translateY(6px) rotate(2.5deg); } 14%, 92% { transform: rotate(-14deg); } 100% { transform: rotate(-14deg) translateY(6px) rotate(2.5deg); } }
      @keyframes mu-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mu-boot__bob, .mu-boot__orb, .mu-boot__racket svg { animation: none !important; } }
    </style>
